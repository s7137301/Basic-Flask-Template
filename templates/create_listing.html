{% extends "layout.html" %}
{% block content %}
    <h2>List Hardware</h2>
    <p class="text-muted">Offer your idle compute power to marketplace buyers.</p>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

    <form action="/create-listing" method="POST" class="row g-3">
        <div class="col-md-6">
            <label for="cpu_preset" class="form-label">CPU</label>
            <select class="form-select" id="cpu_preset" name="cpu_preset" required>
                {% for name, rate in hardware_rates['CPUs'].items() %}<option value="{{ name }}">{{ name }}{% if rate %} (${{ '%.2f'|format(rate) }}/hr){% endif %}</option>{% endfor %}
            </select>
            <input type="text" class="form-control mt-2 d-none" id="custom_cpu" name="custom_cpu" placeholder="Custom CPU name">
        </div>
        <div class="col-md-6">
            <label for="gpu_preset" class="form-label">GPU</label>
            <select class="form-select" id="gpu_preset" name="gpu_preset" required>
                {% for name, rate in hardware_rates['GPUs'].items() %}<option value="{{ name }}">{{ name }}{% if rate %} (${{ '%.2f'|format(rate) }}/hr){% endif %}</option>{% endfor %}
            </select>
            <input type="text" class="form-control mt-2 d-none" id="custom_gpu" name="custom_gpu" placeholder="Custom GPU name">
        </div>
        <div class="col-md-3">
            <label for="ram_gb" class="form-label">RAM (GB)</label>
            <input type="number" class="form-control" id="ram_gb" name="ram_gb" min="1" required>
        </div>
        <div class="col-md-3">
            <label for="hourly_price" class="form-label">Hourly Price ($)</label>
            <input type="number" class="form-control" id="hourly_price" name="hourly_price" min="0" step="0.01" required>
            <span class="badge text-bg-light mt-2" id="recommended-rate">Recommended Rate: $0.00/hr based on selected hardware.</span>
        </div>
        <div class="col-md-4 form-check ms-2">
            <input type="checkbox" class="form-check-input" id="enterprise_only" name="enterprise_only">
            <label class="form-check-label" for="enterprise_only">Enterprise buyers only</label>
        </div>
        <div class="col-md-4">
            <label for="benchmark_score" class="form-label">Benchmark Score</label>
            <input type="number" class="form-control" id="benchmark_score" name="benchmark_score" min="1" value="100" required>
        </div>
        <div class="col-md-4 form-check ms-2">
            <input type="checkbox" class="form-check-input" id="allow_failover" name="allow_failover" checked>
            <label class="form-check-label" for="allow_failover">Allow SLA failover</label>
        </div>
        <div class="col-12 form-check ms-2">
            <input type="checkbox" class="form-check-input" id="absorb_failovers" name="absorb_failovers">
            <label class="form-check-label" for="absorb_failovers">Act as Failover Backup Node</label>
            <span class="info-badge" tabindex="0" role="img" aria-label="SLA failover node information"
                  data-bs-toggle="tooltip" data-bs-placement="top"
                  title="SLA Failover Node: By enabling this, your computer stands by to automatically absorb interrupted tasks if another seller drops offline mid-job. You earn immediate takeover revenue, while the failing seller pays an SLA reliability penalty.">i</span>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Publish Listing</button>
        </div>
    </form>
{% endblock %}
{% block scripts %}
<script>
    var hardwareRates = {{ hardware_rates|tojson }};
    var cpuSelect = document.getElementById('cpu_preset');
    var gpuSelect = document.getElementById('gpu_preset');
    var customCpu = document.getElementById('custom_cpu');
    var customGpu = document.getElementById('custom_gpu');
    var hourlyPrice = document.getElementById('hourly_price');
    var recommendation = document.getElementById('recommended-rate');
    function toggleCustom(select, input) {
        input.classList.toggle('d-none', select.value !== ('Custom ' + select.id.split('_')[0].toUpperCase()));
        input.required = select.value === ('Custom ' + select.id.split('_')[0].toUpperCase());
    }
    function updateRecommendation() {
        var cpuRate = hardwareRates.CPUs[cpuSelect.value] || 0;
        var gpuRate = hardwareRates.GPUs[gpuSelect.value] || 0;
        var recommended = cpuRate + gpuRate;
        recommendation.textContent = 'Recommended Rate: $' + recommended.toFixed(2) + '/hr based on selected hardware.';
        if (!hourlyPrice.dataset.edited) hourlyPrice.value = recommended.toFixed(2);
    }
    [cpuSelect, gpuSelect].forEach(function (select) { select.addEventListener('change', function () {
        toggleCustom(cpuSelect, customCpu); toggleCustom(gpuSelect, customGpu); updateRecommendation();
    }); });
    hourlyPrice.addEventListener('input', function () { hourlyPrice.dataset.edited = 'true'; });
    toggleCustom(cpuSelect, customCpu); toggleCustom(gpuSelect, customGpu); updateRecommendation();
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    tooltipTriggerList.map(function (el) { return new bootstrap.Tooltip(el); });
</script>
{% endblock %}
